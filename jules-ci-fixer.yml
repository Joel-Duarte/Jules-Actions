name: Jules CI Failure Fixer
on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]

jobs:
  fix-build:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run Jules CI Remediation
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            The primary CI build workflow failed on branch '${{ github.event.workflow_run.head_branch }}'.
            Analyze the repository status, isolate compilation errors or broken test suites,
            implement a verified fix, and open a pull request.