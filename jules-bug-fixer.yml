name: Jules Bug Fixer
on:
  issues:
    types: [labeled]

jobs:
  fix-issue:
    if: github.event.label.name == 'jules-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Validate User Allowlist
        if: ${{ contains(fromJSON('["your-github-username", "trusted-maintainer"]'), github.event.issue.user.login) }}
        run: echo "User authorized to trigger Jules."

      - name: Run Jules Bug Fixer
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Fix the bug described in the following GitHub issue:
            Title: ${{ github.event.issue.title }}
            Description: ${{ github.event.issue.body }}
            
            Investigate the relevant repository files, fix the root cause, add regression tests, and open a pull request.